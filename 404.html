@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:700 800;font-display:swap;src:url(/fonts/big-base.woff2) format("woff2");unicode-range:U+0020-007E,U+00A0,U+00B7,U+00D7,U+2013-2014,U+2018-201E,U+2022,U+2026,U+2192}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;scroll-behavior:smooth}
body{line-height:1.55;-webkit-font-smoothing:antialiased;font-size:16px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,a,[role=button]{touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea,select{font-size:16px;font-family:inherit}
.shell{max-width:1360px;margin:0 auto;padding:0 var(--pad)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;background:#fff;color:#000;padding:10px 14px;z-index:99}

header{position:sticky;top:0;z-index:60;border-bottom:1px solid transparent;transition:border-color .35s var(--ease),box-shadow .35s var(--ease)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1360px;margin:0 auto;padding:15px var(--pad);transition:padding .35s var(--ease)}
header.sm .nav{padding:9px var(--pad)}
.logo{display:block;padding:4px 0;margin:-4px 0;min-width:0}
.logo small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:18px;opacity:1;transition:opacity .3s var(--ease),max-height .35s var(--ease),margin-top .35s var(--ease)}
header.sm .logo small{opacity:0;max-height:0;margin-top:0!important}
.call{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);font-weight:600;font-size:14px;white-space:nowrap;flex-shrink:0;transition:transform .12s var(--ease),background .2s var(--ease)}
.call:active{transform:scale(.97)}
.call svg{width:16px;height:16px;flex-shrink:0}

.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:14px 24px;border-radius:var(--r);font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:transform .12s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
.btn:active{transform:scale(.975)}
.btn.p::after{content:"\2192";display:inline-block;transition:transform .28s var(--ease)}

.q summary{cursor:pointer;list-style:none;user-select:none;-webkit-user-select:none;position:relative;padding:20px 44px 20px 0}
.q summary::-webkit-details-marker{display:none}
.q summary::before,.q summary::after{content:"";position:absolute;right:4px;top:calc(50% - 1px);width:15px;height:2px;transition:transform .35s var(--ease)}
.q summary::before{transform:rotate(90deg)}
.q[open] summary::before{transform:rotate(0)}
.q summary:active{opacity:.55}
.js .q .ans{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s var(--ease),opacity .3s var(--ease)}
.js .q .ans>p{overflow:hidden}
.js .q.expanded .ans{grid-template-rows:1fr;opacity:1}
.q .ans>p{padding:0 0 22px;max-width:62ch}

.pair{display:grid;gap:14px;grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:color .22s var(--ease)}
input,textarea,select{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;min-height:44px;background:none;color:var(--ink);transition:border-color .22s var(--ease)}
select{-webkit-appearance:none;appearance:none;padding-right:22px;background-repeat:no-repeat;background-position:right center}
input:focus,textarea:focus,select:focus{outline:none}
textarea{min-height:96px;resize:vertical}
.note{font-size:12.5px;margin-top:16px;line-height:1.65}

.madeby{display:inline-flex;align-items:center;line-height:0}
.madeby img{height:26px;width:auto;opacity:.62;filter:invert(1);transition:opacity .25s var(--ease)}
footer p a,footer .fl a{display:inline-block;padding:6px 0}

:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}

.js .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0)*70ms)}
.reveal.in{opacity:1;transform:none}
.js .reveal.split{opacity:1;transform:none;transition:none}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em;margin-bottom:-.1em;padding-top:.16em;margin-top:-.16em}
.w>i{display:inline-block;font-style:inherit;color:inherit;transform:translateY(110%);transition:transform .9s var(--ease);transition-delay:calc(var(--d,0)*45ms)}
.split.in .w>i{transform:none}

@media(min-width:760px){.pair{grid-template-columns:1fr 1fr}}
@media(hover:hover) and (pointer:fine){
 .btn.p:hover::after{transform:translateX(5px)}
 .madeby:hover img{opacity:1}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
 .reveal{opacity:1;transform:none}
 .w>i{transform:none}
}

:root{
 --paper:#F5F2EA; --paper2:#ECE7DB; --ink:#0F1E2B; --white:#FFFFFF; --line:#D9D2C3; --dline:#24394B;
 --sea:#13466B; --sig:#F2B705; --muted:#4F5A63; --dim:#9FB0BE;
 --pad:clamp(20px,4.5vw,64px); --r:6px; --focus:#13466B;
 --disp:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;
 --sans:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --ease:cubic-bezier(.16,1,.3,1);
}
body{font-family:var(--sans);color:var(--ink);background:var(--paper)}
p{color:var(--muted)}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.01em;line-height:.92;text-transform:uppercase}
h1{font-size:clamp(52px,8.4vw,120px)}
h2{font-size:clamp(40px,5.6vw,78px)}
h3{font-size:clamp(26px,2.5vw,34px);line-height:1}
.tag{font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}
.dark .tag{color:var(--sig)}

.banner{background:var(--ink);color:#AFC0CE;padding:9px var(--pad);padding-top:calc(9px + env(safe-area-inset-top,0px));text-align:center;font-size:12px;line-height:1.5}
.banner b{color:#fff;font-weight:600}
header{background:rgba(245,242,234,.94);backdrop-filter:blur(10px)}
header.sm{border-bottom-color:var(--line)}
.logo b{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.logo b i{width:14px;height:24px;background:var(--sig);transform:skewX(-14deg);flex-shrink:0}
.logo small{font-size:12px;font-weight:500;color:var(--muted);margin-top:4px;padding-left:24px}
.call{background:var(--sig);color:var(--ink)}
.menu{display:none;align-items:center;gap:clamp(16px,2vw,30px);margin-left:auto;margin-right:clamp(8px,1.4vw,20px)}
.menu a{display:inline-block;padding:12px 0;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid transparent;transition:border-color .2s var(--ease)}
@media(min-width:900px){.menu{display:flex}}
.kick{display:block;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.14em;line-height:1.4;color:var(--sea);margin-bottom:14px;max-width:none}
.maplink{display:inline-block;margin-top:10px;padding:10px 0;font-size:15px;font-weight:600;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.card .maplink{color:var(--sig)}

/* hero */
.hero{padding:clamp(26px,3.6vw,56px) 0 clamp(44px,5vw,76px)}
.herogrid{display:grid;gap:clamp(28px,3vw,44px)}
.open{display:inline-flex;align-items:center;gap:10px;min-height:34px;padding:0 14px;border-radius:100px;background:var(--white);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}
.open i{width:8px;height:8px;border-radius:50%;background:#9AA3AA}
.open.on i{background:#1F9D55;box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.open[hidden]{display:none}
.hero h1{margin-top:18px}
.hero h1 .big{display:block;max-width:9ch}
.hero h1 .y{background:linear-gradient(transparent 62%,var(--sig) 62%,var(--sig) 92%,transparent 92%)}
.lead{font-size:clamp(16.5px,1.4vw,19.5px);max-width:44ch;margin-top:22px;line-height:1.6}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.enl{margin-top:18px;font-size:14.5px;color:var(--muted)}
.enl a{display:inline-block;padding:10px 0;font-weight:600;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
.btn.p{background:var(--ink);color:#fff}
.btn.g{background:transparent;border-color:#BDB4A2;color:var(--ink)}
.heroimg{position:relative;border-radius:var(--r);overflow:hidden;background:var(--paper2)}
.heroimg picture{display:block}
.heroimg img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;transition:transform 1.7s cubic-bezier(.16,.8,.24,1)}
.js .heroimg img{transform:scale(1.07)}
.heroimg.in img{transform:scale(1)}
.since{position:absolute;left:0;bottom:0;background:var(--sig);color:var(--ink);padding:14px 20px 12px;font-family:var(--disp);font-weight:800;text-transform:uppercase;line-height:.9}
.since small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.12em;margin-bottom:4px}
.since b{font-size:44px}

.sec{padding:clamp(64px,8vw,120px) 0}
.dark{background:var(--ink);color:#fff}
.dark p{color:var(--dim)}
.dark h2,.dark h3{color:#fff}

/* lanes */
.lanes{display:grid;gap:clamp(14px,1.6vw,22px);margin-top:clamp(30px,3.6vw,50px)}
.lane{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.lane figure{margin:0;overflow:hidden;background:var(--paper2)}
.lane figure img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;transition:transform .8s var(--ease)}
.lane .in-{padding:clamp(20px,2.4vw,32px)}
.lane .k{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sea)}
.lane .k::before{content:"";width:22px;height:3px;background:var(--sig)}
.lane h3{margin:10px 0 10px;font-size:clamp(32px,3.4vw,46px)}
.lane p{font-size:15.5px;max-width:46ch}
.lane ul{list-style:none;margin-top:16px}
.lane li{padding:12px 0 12px 22px;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink);position:relative}
.lane li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:3px;background:var(--sea)}


/* gallery */
.gal{display:grid;gap:clamp(12px,1.4vw,18px);margin-top:clamp(28px,3.4vw,46px)}
.gal figure{margin:0;border-radius:var(--r);overflow:hidden;background:var(--paper2);position:relative}
.gal img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;transition:transform .8s var(--ease)}
.gal figcaption{position:absolute;left:0;bottom:0;background:var(--ink);color:#fff;padding:9px 14px;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
@media(min-width:620px){.gal{grid-template-columns:1fr 1fr}.gal figure:first-child{grid-column:1/-1}.gal figure:first-child img{aspect-ratio:16/9}}
@media(min-width:1000px){.gal{grid-template-columns:repeat(3,1fr)}.gal figure:first-child{grid-column:auto}.gal figure:first-child img{aspect-ratio:4/3}}
@media(hover:hover) and (pointer:fine){.gal figure:hover img{transform:scale(1.045)}}

/* road band */
.road{position:relative;overflow:hidden}
.road .grid{display:grid;gap:clamp(24px,3vw,48px);align-items:center}
.road figure{margin:0;border-radius:var(--r);overflow:hidden}
.road figure img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.road h2{max-width:12ch;margin-top:14px}
.road p{font-size:16.5px;max-width:44ch;margin-top:18px}
.road .note2{display:inline-block;margin-top:18px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sig)}
.dash{position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--sig) 0 46px,transparent 46px 80px);background-size:80px 6px;animation:drive 2.4s linear infinite}
@keyframes drive{to{background-position:80px 0}}

/* parts + hours */
.two{display:grid;gap:clamp(14px,1.6vw,22px);margin-top:clamp(30px,3.6vw,50px)}
.box{border-radius:var(--r);overflow:hidden;background:var(--white);border:1px solid var(--line)}
.box figure{margin:0}
.box figure img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.box .in-{padding:clamp(20px,2.4vw,30px)}
.box h3{margin-bottom:8px}
.box p{font-size:15.5px}
.hours{list-style:none;margin-top:6px}
.hours li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink)}
.hours li span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
.hours li.today{font-weight:700}
.hours li.today span:first-child::after{content:" · danas";color:var(--sea);font-weight:600}
.addr{margin-top:18px;font-size:15.5px;color:var(--ink)}

/* faq */
.fq{display:grid;gap:clamp(20px,3vw,48px)}
.q{border-bottom:1px solid var(--line)}
.q:first-of-type{border-top:1px solid var(--line)}
.q summary{font-weight:600;font-size:clamp(18px,1.7vw,22px);letter-spacing:-.01em;line-height:1.25}
.q summary::before,.q summary::after{background:var(--sea)}
.q .ans>p{font-size:16px}

/* form */
.cols{display:grid;gap:clamp(24px,3vw,44px)}
.form{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,3vw,38px)}
label{color:var(--muted)}
.field:focus-within label{color:var(--sea)}
input:focus,textarea:focus,select:focus{border-bottom-color:var(--sea)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2313466B' stroke-width='1.6'/></svg>")}
input::placeholder,textarea::placeholder{color:#848B90}
.note{color:var(--muted)}
.card{background:var(--ink);color:#fff;border-radius:var(--r);padding:clamp(22px,3vw,32px)}
.cl{display:grid;gap:3px;padding:14px 0;border-bottom:1px solid var(--dline)}
.cl:last-child{border-bottom:0}
.cl b{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cl span{font-size:17px;font-weight:500;transition:color .2s var(--ease)}

footer{background:var(--ink);color:#fff;padding-top:clamp(46px,6vw,78px);overflow:hidden}
.fgrid{display:grid;gap:28px}
footer p.fh{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.13em;line-height:1.4;text-transform:uppercase;color:#8FA2B3;margin-bottom:10px}
.flinks{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:26px}
.flinks a{display:inline-block;padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.legal{margin-top:18px;font-size:13px!important;color:#8FA2B3!important}
footer p,footer a{color:#BFCBD5;font-size:15px}
.bigmark{font-family:var(--disp);font-size:clamp(60px,15vw,220px);font-weight:800;text-transform:uppercase;line-height:.84;color:#172B3C;margin-top:clamp(32px,4.5vw,62px);white-space:nowrap;user-select:none}
.credit{border-top:1px solid var(--dline);margin-top:clamp(22px,3vw,34px);padding:18px 0 calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8FA2B3;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.dark :focus-visible,footer :focus-visible,.card :focus-visible{outline-color:#fff}

@media(max-width:520px){.logo small{font-size:11px}.call .t{display:none}.call{padding:0 14px}}
@media(min-width:900px){.lanes,.two{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){
 .herogrid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(40px,5vw,84px)}
 .road .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .fq{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}
 .cols{grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);align-items:start}
 .fgrid{grid-template-columns:2fr 1fr 1fr;gap:48px}
}
@media(hover:hover) and (pointer:fine){
 .btn.p:hover{background:#1D3346}
 .call:hover{background:#FFC72C}
 .btn.g:hover{border-color:var(--ink)}
 .lane figure:hover img{transform:scale(1.045)}
 .cl:hover span{color:var(--sig)}
 .menu a:hover{border-bottom-color:var(--sig)}
}
@media(prefers-reduced-motion:reduce){.js .heroimg img{transform:none}.dash,.open.on i{animation:none}}
</style>
</head>

<script>
(function(){
 var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
 document.documentElement.classList.add('js');

 function splitWords(el){
  if(RM) return;
  var i=0;
  (function walk(node){
   [].slice.call(node.childNodes).forEach(function(n){
    if(n.nodeType===3){
     var parts=n.nodeValue.split(/(\s+)/), frag=document.createDocumentFragment();
     parts.forEach(function(t){
      if(!t) return;
      if(/^\s+$/.test(t)){ frag.appendChild(document.createTextNode(t)); return; }
      var w=document.createElement('span'); w.className='w';
      var inner=document.createElement('i'); inner.style.setProperty('--d',i++); inner.textContent=t;
      w.appendChild(inner); frag.appendChild(w);
     });
     node.replaceChild(frag,n);
    } else if(n.nodeType===1 && n.className!=='w'){ walk(n); }
   });
  })(el);
 }
 [].forEach.call(document.querySelectorAll('.split'),splitWords);

 var els=[].slice.call(document.querySelectorAll('.reveal, [data-io]'));
 function on(el){ el.classList.add('in'); }
 if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
   /* also reveal anything already scrolled past: deep links and restored
      scroll positions would otherwise leave sections hidden for good */
   if(e.isIntersecting || e.boundingClientRect.top < 0){ on(e.target); io.unobserve(e.target); }
  })},{rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(e){io.observe(e)});
 } else els.forEach(on);

 var hdr=document.querySelector('header'), last=null;
 function sc(){
  var y=window.pageYOffset||document.documentElement.scrollTop, sm=y>70;
  if(sm!==last){ hdr.classList.toggle('sm',sm); last=sm; }
 }
 window.addEventListener('scroll',sc,{passive:true}); sc();

 [].forEach.call(document.querySelectorAll('.q'),function(d){
  var s=d.querySelector('summary'), t;
  if(d.open) d.classList.add('expanded');
  s.addEventListener('click',function(ev){
   ev.preventDefault(); clearTimeout(t);
   if(d.classList.contains('expanded')){
    d.classList.remove('expanded');
    t=setTimeout(function(){d.open=false},RM?0:400);
   } else {
    d.open=true;
    requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('expanded')})});
   }
  });
 });

 var f=document.getElementById('frm');
 if(f) f.addEventListener('submit',function(e){
  e.preventDefault();
  var lines=[];
  [].forEach.call(f.querySelectorAll('[data-label]'),function(el){
   var v=(el.value||'').trim(); if(v) lines.push(el.getAttribute('data-label')+': '+v);
  });
  window.location.href='mailto:'+f.getAttribute('data-to')+'?subject='+encodeURIComponent(f.getAttribute('data-subject'))+'&body='+encodeURIComponent(lines.join('\n'));
 });
})();
</script>
